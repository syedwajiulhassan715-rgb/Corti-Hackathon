<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECHO — room-02</title>
<style>
  :root {
    --bg:#0c0f14; --panel:#141922; --sunk:#0e131b; --line:#232a36; --ink:#e7edf5;
    --dim:#8b97a8; --faint:#5b6675;
    --green:#3fb950; --yellow:#d29922; --urgent:#f0883e; --emergency:#f85149;
    --patient:#58a6ff; --clinician:#bc8cff; --new:#f0883e; --known:#3fb950; --ask:#e3b341;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
  h1{font-size:16px;margin:0;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
  h1 span{color:var(--faint);font-weight:400}
  .who-hdr{display:flex;flex-direction:column;gap:1px;min-width:180px}
  .who-hdr b{font-size:15px}
  .who-hdr small{color:var(--faint);font-size:11px}
  .sim{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#000;
    background:var(--ask);padding:2px 6px;border-radius:3px;font-weight:700;align-self:flex-start;margin-top:2px}
  .badge{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    padding:7px 14px;border-radius:999px;border:1px solid;white-space:nowrap}
  .green{color:var(--green);border-color:var(--green);background:#3fb95018}
  .yellow{color:var(--yellow);border-color:var(--yellow);background:#d2992218}
  .urgent{color:var(--urgent);border-color:var(--urgent);background:#f0883e18}
  .emergency{color:var(--emergency);border-color:var(--emergency);background:#f8514922}
  .scrub{flex:1 1 300px;display:flex;align-items:center;gap:12px;min-width:240px}
  .scrub input{flex:1;accent-color:var(--patient)}
  .clock{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;white-space:nowrap}
  main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;padding:18px 22px 60px}
  @media(max-width:1050px){main{grid-template-columns:1fr}}
  .col{display:flex;flex-direction:column;gap:18px;min-width:0}
  section{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  section>h2{margin:0;padding:11px 15px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
  section>h2 em{font-style:normal;color:var(--faint);text-transform:none;letter-spacing:0}
  .body{max-height:52vh;overflow-y:auto}
  .muted{color:var(--dim);padding:14px 15px;font-size:14px}
  .err{color:var(--emergency);padding:16px}

  /* extraction */
  .ex{padding:12px 15px;border-bottom:1px solid var(--line)}
  .ex:last-child{border-bottom:0}
  .ex .src{color:var(--dim);font-size:13.5px}
  .ex .src .sp{font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-right:7px}
  .ex .arrow{color:var(--faint);font-size:11px;margin:6px 0 4px;letter-spacing:.05em}
  .ex .out{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:5px;
    border:1px solid var(--new);color:var(--new);background:#f0883e14;font-weight:600}
  .eid{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}

  /* history */
  .item{padding:10px 15px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:flex-start}
  .item:last-child{border-bottom:0}
  .dot{width:7px;height:7px;border-radius:50%;margin-top:7px;flex:none}
  .dot.new{background:var(--new)} .dot.known{background:var(--known)}
  .item .code{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  .item .txt{min-width:0}
  .legend{display:flex;gap:14px;padding:9px 15px;border-bottom:1px solid var(--line);font-size:11px;color:var(--faint)}
  .legend i{font-style:normal;display:inline-flex;align-items:center;gap:5px}

  /* questions */
  .q{padding:13px 15px;border-bottom:1px solid var(--line);border-left:3px solid var(--ask)}
  .q:last-child{border-bottom:0}
  .q .cond{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ask)}
  .q .ask{margin:4px 0 6px;font-weight:600}
  .q .why{color:var(--dim);font-size:13.5px}
  .q .ev{margin-top:6px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}

  /* transcript */
  .turn{padding:8px 15px;border-left:3px solid transparent}
  .turn.future{opacity:.2}
  .turn.trigger{background:#f8514914;border-left-color:var(--emergency)}
  .whorow{font-size:10px;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:8px;align-items:baseline}
  .whorow .t{color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:0}
  .p-patient{color:var(--patient)} .p-clinician{color:var(--clinician)} .p-unknown{color:var(--faint)}
  .chips{margin-top:4px;display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid var(--line);
    color:var(--dim);background:var(--sunk);font-variant-numeric:tabular-nums}
  .chip.code{color:#7ee787;border-color:#7ee78740}
  .chip.fact{color:var(--new);border-color:#f0883e40}
  .row{padding:10px 15px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .stages{display:flex;flex-wrap:wrap}
  .stage{flex:1 1 80px;padding:11px 8px;text-align:center;border-right:1px solid var(--line)}
  .stage:last-child{border-right:0}
  .stage b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  .stage span{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
</style>
</head>
<body>
<header>
  <h1>ECHO <span>/ room-02</span></h1>
  <div class="who-hdr">
    <b id="pname">—</b>
    <small id="pmeta"></small>
    <span class="sim" id="psim" hidden>simulated chart link</span>
  </div>
  <div id="badge" class="badge green">—</div>
  <div class="scrub">
    <input id="scrub" type="range" min="0" max="100" value="100" step="1">
    <div class="clock" id="clock">—</div>
  </div>
</header>

<main>
  <div class="col">
    <section>
      <h2>1 · Facts extracted from the conversation <em id="exn"></em></h2>
      <div class="body" id="extract"><div class="muted">Loading…</div></div>
    </section>

    <section>
      <h2>Transcript <em id="heard"></em></h2>
      <div class="body" id="turns"></div>
    </section>
  </div>

  <div class="col">
    <section>
      <h2>2 · Held against her chart <em id="chartn"></em></h2>
      <div class="legend">
        <i><span class="dot new"></span> new — not on the problem list</i>
        <i><span class="dot known"></span> already known</i>
      </div>
      <div id="hist"><div class="muted">Loading…</div></div>
    </section>

    <section>
      <h2>3 · What her history makes worth asking <em>questions, not conclusions</em></h2>
      <div id="flags"><div class="muted">Loading…</div></div>
    </section>

    <section>
      <h2>Patient State <em id="changed"></em></h2>
      <div class="stages" id="stages"></div>
      <div id="card"></div>
    </section>
  </div>
</main>

<script>
const LEVEL_CLASS={green:"green",yellow:"yellow","red-urgent":"urgent","red-emergency":"emergency"};
const FACTS=["symptom","hcp_concern","severe_statement","emergency_request"];

let EVENTS=[],UTTERANCES=[],TMIN=0,TMAX=0;
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmmss=(ts)=>new Date(ts).toISOString().slice(11,19);

async function boot(){
  try{
    const log=await (await fetch("/log")).json();
    EVENTS=log.events;
    UTTERANCES=EVENTS.filter((e)=>e.observation==="utterance");
    if(!UTTERANCES.length) throw new Error("no utterances in the log");
    TMIN=Math.min(...EVENTS.map((e)=>e.ts));
    TMAX=Math.max(...EVENTS.map((e)=>e.ts));
    $("scrub").addEventListener("input",()=>render(untilFromScrub()));
    await render(TMAX);
  }catch(e){
    document.querySelector("main").innerHTML=
      '<div class="err">Could not load: '+esc(e.message)+
      "<br><br>Start with <code>ECHO_LOG=runs/room-02/events.jsonl npm run demo</code></div>";
  }
}
function untilFromScrub(){
  const pct=Number($("scrub").value)/100;
  return Math.round(TMIN+(TMAX-TMIN)*pct);
}

async function render(until){
  $("clock").textContent=hhmmss(until)+"  ·  +"+((until-TMIN)/1000).toFixed(1)+"s";
  const [ward,hist]=await Promise.all([
    (await fetch("/ward?until="+until)).json(),
    (await fetch("/history?until="+until+"&room=room-02")).json(),
  ]);
  const card=ward.rooms.find((r)=>r.room==="room-02");
  const evIds=new Set((card?card.patient.evidence:[]).map((e)=>e.id));
  const triggerQuotes=new Set(EVENTS.filter((e)=>evIds.has(e.id)).map((e)=>e.quote));

  renderPatient(hist);
  renderExtraction(hist);
  renderHistory(hist);
  renderFlags(hist);
  renderTurns(until,triggerQuotes);
  renderStages(until);
  renderCard(card);
}

function renderPatient(h){
  if(h.error){$("pname").textContent="—";return;}
  $("pname").textContent=h.patient;
  $("pmeta").textContent=h.summary+"  ·  MRN "+h.mrn;
  $("psim").hidden=!h.simulated;
}

function renderExtraction(h){
  if(!h.extracted||!h.extracted.length){
    $("extract").innerHTML='<div class="muted">Nothing extracted yet at this moment.</div>';
    $("exn").textContent="0 facts";return;
  }
  $("exn").textContent=h.extracted.length+" facts appended to the log";
  $("extract").innerHTML=h.extracted.map((f)=>{
    const src=UTTERANCES.find((u)=>u.quote===f.quote);
    return '<div class="ex">'+
      '<div class="src"><span class="sp p-'+esc(f.speaker)+'">'+esc(f.speaker)+"</span>"+
        '<span class="eid">'+esc(src?src.id:"?")+" · "+hhmmss(f.ts)+"</span><br>&ldquo;"+
        esc(f.quote)+"&rdquo;</div>"+
      '<div class="arrow">↓ extracted</div>'+
      '<div class="out"><span class="tag">'+esc(f.observation.replace(/_/g," "))+"</span>"+
        '<span class="eid">appended as '+esc(f.eventId)+"</span></div>"+
    "</div>";
  }).join("");
}

function renderHistory(h){
  if(h.error){$("hist").innerHTML='<div class="muted">'+esc(h.error)+"</div>";return;}
  $("chartn").textContent=h.conditions.length+" conditions on the problem list";
  const rows=[
    ...h.fresh.map((f)=>[f,"new",""]),
    ...h.known.map((f)=>[f,"known",f.matchesCondition]),
  ];
  if(!rows.length){$("hist").innerHTML='<div class="muted">No coded findings yet.</div>';return;}
  $("hist").innerHTML=rows.map(([f,kind,label])=>
    '<div class="item"><span class="dot '+kind+'"></span><div class="txt">'+
      '<div class="code">'+esc(f.code)+"  ·  "+esc(f.eventId)+"  ·  "+esc(f.speaker)+
        (label?"  ·  already on chart: "+esc(label):"")+"</div>"+
      "<div>&ldquo;"+esc(f.quote)+"&rdquo;</div></div></div>"
  ).join("");
}

function renderFlags(h){
  if(!h.flags||!h.flags.length){
    $("flags").innerHTML='<div class="muted">Nothing on her chart is triggered by what has been said so far.</div>';
    return;
  }
  $("flags").innerHTML=h.flags.map((f)=>
    '<div class="q"><div class="cond">'+esc(f.condition)+" · "+esc(f.conditionLabel)+"</div>"+
      '<div class="ask">'+esc(f.question)+"</div>"+
      '<div class="why">'+esc(f.why)+"</div>"+
      '<div class="ev">matched '+esc(f.matched.join(", "))+
        "  ·  evidence "+esc(f.evidence.join(", "))+"</div></div>"
  ).join("");
}

function renderTurns(until,triggerQuotes){
  $("turns").innerHTML=UTTERANCES.map((u)=>{
    const future=u.ts>until;
    const derived=EVENTS.filter((e)=>e.quote===u.quote&&FACTS.includes(e.observation)&&e.ts<=until);
    const chips=[];
    if(u.code) chips.push('<span class="chip code">'+esc(u.code)+"</span>");
    for(const d of derived) chips.push('<span class="chip fact">'+esc(d.observation)+"</span>");
    return '<div class="turn'+(future?" future":"")+
      (!future&&triggerQuotes.has(u.quote)?" trigger":"")+'">'+
      '<div class="whorow"><span class="p-'+esc(u.speaker)+'">'+esc(u.speaker)+"</span>"+
        '<span class="t">'+hhmmss(u.ts)+"</span></div>"+
      "<div>"+esc(u.quote)+"</div>"+
      (chips.length?'<div class="chips">'+chips.join("")+"</div>":"")+"</div>";
  }).join("");
  $("heard").textContent=UTTERANCES.filter((u)=>u.ts<=until).length+" of "+UTTERANCES.length;
}

function renderStages(until){
  const seen=EVENTS.filter((e)=>e.ts<=until);
  const utt=seen.filter((e)=>e.observation==="utterance");
  const s=[["Heard",utt.length],
    ["Voices",new Set(utt.filter((e)=>e.speaker!=="unknown").map((e)=>e.speaker)).size],
    ["Coded",utt.filter((e)=>e.code).length],
    ["Facts",seen.filter((e)=>FACTS.includes(e.observation)).length]];
  $("stages").innerHTML=s.map(([l,n])=>'<div class="stage"><b>'+n+"</b><span>"+l+"</span></div>").join("");
}

function renderCard(card){
  if(!card){$("card").innerHTML='<div class="muted">No card.</div>';return;}
  const p=card.patient;
  $("badge").className="badge "+(LEVEL_CLASS[p.level]||"green");
  $("badge").textContent=p.level.replace("-"," ");
  $("changed").textContent=p.level===p.previous_level?"":"was "+p.previous_level;
  $("card").innerHTML=
    '<div class="row">'+esc(p.reason_text)+"</div>"+
    '<div class="row"><div class="k">Response</div>'+esc(p.response.text)+"</div>"+
    (p.evidence.length
      ? p.evidence.map((e)=>'<div class="row"><div class="k">Evidence · '+esc(e.id)+" · "+esc(e.speaker)+
          "</div>&ldquo;"+esc(e.quote)+"&rdquo;</div>").join("")
      : '<div class="muted">No evidence cited.</div>');
}

boot();
</script>
</body>
</html>
