<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECHO — ward</title>
<style>
  :root{
    --bg:#0b0e13;--panel:#141922;--sunk:#0e131b;--line:#232a36;--ink:#e7edf5;
    --dim:#8b97a8;--faint:#5b6675;
    --green:#3fb950;--yellow:#d29922;--urgent:#f0883e;--emergency:#f85149;
    --patient:#58a6ff;--clinician:#bc8cff;--ask:#e3b341;--new:#f0883e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  header{padding:13px 22px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:9}
  h1{font-size:16px;margin:0;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;cursor:pointer}
  h1 span{color:var(--faint);font-weight:400}
  button{font:inherit;font-size:13px;background:var(--panel);color:var(--ink);
    border:1px solid var(--line);border-radius:7px;padding:7px 15px;cursor:pointer}
  button:hover{border-color:var(--dim)}
  button.play{min-width:96px;font-weight:600}
  .scrub{flex:1 1 280px;display:flex;align-items:center;gap:12px;min-width:220px}
  .scrub input{flex:1;accent-color:var(--patient)}
  .clock{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;white-space:nowrap}
  .sim{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#000;
    background:var(--ask);padding:3px 7px;border-radius:3px;font-weight:700}
  main{padding:20px 22px 60px}

  /* ---------- board ---------- */
  .board{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
  .room{background:var(--panel);border:1px solid var(--line);border-radius:11px;
    overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s}
  .room:hover{transform:translateY(-2px)}
  .room.lvl-yellow{border-color:#d2992255}
  .room.lvl-urgent{border-color:#f0883e66}
  .room.lvl-emergency{border-color:var(--emergency);box-shadow:0 0 0 1px #f8514955,0 8px 30px #f8514922}
  .room.hasq:not(.lvl-emergency){border-color:#e3b34166}
  .rhead{padding:13px 15px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .rhead .no{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .rhead .nm{font-size:16px;font-weight:600;margin-top:1px}
  .rhead .mt{font-size:11.5px;color:var(--faint)}
  .badge{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:5px 10px;border-radius:999px;border:1px solid;white-space:nowrap;flex:none}
  .green{color:var(--green);border-color:var(--green);background:#3fb95018}
  .yellow{color:var(--yellow);border-color:var(--yellow);background:#d2992218}
  .urgent{color:var(--urgent);border-color:var(--urgent);background:#f0883e18}
  .emergency{color:var(--emergency);border-color:var(--emergency);background:#f8514922}
  .vitals{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line);background:var(--sunk)}
  .v{flex:1 1 60px;padding:9px 6px;text-align:center;border-right:1px solid var(--line)}
  .v:last-child{border-right:0}
  .v b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
  .v span{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
  .v.hot b{color:var(--emergency)}
  .v.warm b{color:var(--urgent)}
  .qs{border-top:1px solid var(--line)}
  .qrow{padding:11px 15px;border-left:3px solid var(--ask);border-bottom:1px solid var(--line)}
  .qrow:last-child{border-bottom:0}
  .qrow .qc{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ask)}
  .qrow .qq{margin-top:3px;font-size:13.5px;font-weight:600}
  .quiet{padding:12px 15px;color:var(--faint);font-size:13px;border-top:1px solid var(--line)}
  .bg-rooms{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .bg{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 13px;font-size:12px;color:var(--faint)}

  /* ---------- detail ---------- */
  .detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px}
  @media(max-width:1040px){.detail{grid-template-columns:1fr}}
  .col{display:flex;flex-direction:column;gap:18px;min-width:0}
  section{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  section>h2{margin:0;padding:11px 15px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
  section>h2 em{font-style:normal;color:var(--faint);text-transform:none;letter-spacing:0}
  .body{max-height:50vh;overflow-y:auto}
  .muted{color:var(--dim);padding:14px 15px;font-size:14px}
  .ex{padding:12px 15px;border-bottom:1px solid var(--line)}
  .ex:last-child{border-bottom:0}
  .ex .src{color:var(--dim);font-size:13.5px}
  .ex .arrow{color:var(--faint);font-size:11px;margin:6px 0 4px}
  .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:5px;
    border:1px solid var(--new);color:var(--new);background:#f0883e14;font-weight:600}
  .eid{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  .item{padding:10px 15px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:flex-start}
  .item:last-child{border-bottom:0}
  .dot{width:7px;height:7px;border-radius:50%;margin-top:7px;flex:none}
  .dot.new{background:var(--new)}.dot.known{background:var(--green)}
  .item .code{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  .legend{display:flex;gap:14px;padding:9px 15px;border-bottom:1px solid var(--line);font-size:11px;color:var(--faint)}
  .legend i{font-style:normal;display:inline-flex;align-items:center;gap:5px}
  .q{padding:13px 15px;border-bottom:1px solid var(--line);border-left:3px solid var(--ask)}
  .q:last-child{border-bottom:0}
  .q .cond{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ask)}
  .q .ask{margin:4px 0 6px;font-weight:600}
  .q .why{color:var(--dim);font-size:13.5px}
  .q .ev{margin-top:6px;font-size:11px;color:var(--faint)}
  .turn{padding:8px 15px;border-left:3px solid transparent}
  .turn.future{opacity:.2}
  .turn.trigger{background:#f8514914;border-left-color:var(--emergency)}
  .whorow{font-size:10px;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:8px;align-items:baseline}
  .whorow .t{color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:0}
  .p-patient{color:var(--patient)}.p-clinician{color:var(--clinician)}.p-unknown{color:var(--faint)}
  .chips{margin-top:4px;display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid var(--line);
    color:var(--dim);background:var(--sunk)}
  .chip.code{color:#7ee787;border-color:#7ee78740}
  .chip.fact{color:var(--new);border-color:#f0883e40}
  .row{padding:10px 15px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .err{color:var(--emergency);padding:16px}
</style>
</head>
<body>
<header>
  <h1 id="home">ECHO <span id="crumb">/ ward</span></h1>
  <button class="play" id="play">▶ Play</button>
  <div class="scrub">
    <input id="scrub" type="range" min="0" max="1000" value="0" step="1">
    <div class="clock" id="clock">—</div>
  </div>
  <span class="sim">simulated monitors &amp; chart links</span>
</header>

<main id="main"><div class="muted">Loading…</div></main>

<script>
const LVL={green:"green",yellow:"yellow","red-urgent":"urgent","red-emergency":"emergency"};
const FACTS=["symptom","hcp_concern","severe_statement","emergency_request"];
const VITAL_LABEL={toks:"TOKS",spo2:"SpO₂",heart_rate:"HR",respiratory_rate:"RR",systolic_bp:"SBP",temperature:"Temp"};
const VITAL_ORDER=["toks","spo2","heart_rate","respiratory_rate","systolic_bp","temperature"];

let EVENTS=[],TMIN=0,TMAX=0,VIEW="board",ROOM=null,TIMER=null;
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm=(ts)=>new Date(ts).toISOString().slice(11,19);
const until=()=>Math.round(TMIN+(TMAX-TMIN)*(Number($("scrub").value)/1000));

async function boot(){
  try{
    EVENTS=(await (await fetch("/log")).json()).events;
    if(!EVENTS.length) throw new Error("log is empty");
    TMIN=Math.min(...EVENTS.map((e)=>e.ts));
    TMAX=Math.max(...EVENTS.map((e)=>e.ts));
    $("scrub").addEventListener("input",()=>{stop();draw();});
    $("play").addEventListener("click",toggle);
    $("home").addEventListener("click",()=>{VIEW="board";ROOM=null;draw();});
    await draw();
  }catch(e){
    $("main").innerHTML='<div class="err">Could not load: '+esc(e.message)+
      "<br><br>Run <code>npm run stage -- ward --run room-02</code> then "+
      "<code>ECHO_LOG=runs/room-02/ward.jsonl npm run demo</code></div>";
  }
}

function toggle(){ TIMER?stop():start(); }
function start(){
  if(Number($("scrub").value)>=1000) $("scrub").value=0;
  $("play").textContent="❚❚ Pause";
  TIMER=setInterval(()=>{
    const next=Number($("scrub").value)+4;
    $("scrub").value=Math.min(1000,next);
    draw();
    if(next>=1000) stop();
  },120);
}
function stop(){ if(TIMER){clearInterval(TIMER);TIMER=null;} $("play").textContent="▶ Play"; }

async function draw(){
  const t=until();
  $("clock").textContent=hhmm(t)+"  ·  T+"+((t-TMIN)/60000).toFixed(1)+" min";
  $("crumb").textContent=VIEW==="board"?"/ ward":"/ "+ROOM;
  if(VIEW==="board") await drawBoard(t); else await drawRoom(t);
}

/* ------------------------------- board ------------------------------- */
async function drawBoard(t){
  const board=await (await fetch("/board?until="+t)).json();
  const live=board.rooms.filter((r)=>r.kind==="interactive");
  const bg=board.rooms.filter((r)=>r.kind!=="interactive");

  $("main").innerHTML='<div class="board">'+live.map(roomCard).join("")+"</div>"+
    '<div class="bg-rooms">'+bg.map((r)=>'<div class="bg">'+esc(r.room)+" · quiet</div>").join("")+"</div>";

  for(const el of document.querySelectorAll("[data-room]")){
    el.addEventListener("click",()=>{VIEW="room";ROOM=el.dataset.room;draw();});
  }
}

function roomCard(r){
  const cls=LVL[r.level]||"green";
  const vitals=VITAL_ORDER.filter((k)=>r.vitals[k]!==undefined).map((k)=>{
    const v=r.vitals[k];
    let heat="";
    if(k==="toks") heat=v>=7?"hot":v>=5?"warm":"";
    if(k==="spo2") heat=v<=88?"hot":v<=92?"warm":"";
    if(k==="temperature") heat=v>=38.5?"hot":v>=38?"warm":"";
    if(k==="heart_rate") heat=v>=150?"hot":v>=110?"warm":"";
    if(k==="systolic_bp") heat=v<=85?"hot":v<=100?"warm":"";
    const shown=k==="temperature"?v.toFixed(1):v;
    return '<div class="v '+heat+'"><b>'+shown+"</b><span>"+VITAL_LABEL[k]+"</span></div>";
  }).join("");

  const qs=r.questions.length
    ? '<div class="qs">'+r.questions.map((q)=>
        '<div class="qrow"><div class="qc">'+esc(q.condition)+" · "+esc(q.conditionLabel)+"</div>"+
        '<div class="qq">'+esc(q.question)+"</div></div>").join("")+"</div>"
    : '<div class="quiet">Nothing on this chart is triggered by what is happening.</div>';

  return '<div class="room lvl-'+cls+(r.questions.length?" hasq":"")+'" data-room="'+esc(r.room)+'">'+
    '<div class="rhead"><div><div class="no">'+esc(r.room)+"</div>"+
      '<div class="nm">'+esc(r.patient||"—")+"</div>"+
      '<div class="mt">'+esc(r.summary||"")+"</div></div>"+
      '<div class="badge '+cls+'">'+esc(r.level.replace("-"," "))+"</div></div>"+
    '<div class="vitals">'+vitals+"</div>"+qs+"</div>";
}

/* ------------------------------- detail ------------------------------ */
async function drawRoom(t){
  const [board,h]=await Promise.all([
    (await fetch("/board?until="+t)).json(),
    (await fetch("/history?until="+t+"&room="+ROOM)).json(),
  ]);
  const r=board.rooms.find((x)=>x.room===ROOM);
  const utt=EVENTS.filter((e)=>e.room===ROOM&&e.observation==="utterance");

  const extraction=h.extracted&&h.extracted.length
    ? h.extracted.map((f)=>{
        const src=utt.find((u)=>u.quote===f.quote);
        return '<div class="ex"><div class="src"><span class="eid">'+esc(src?src.id:"?")+" · "+
          esc(f.speaker)+" · "+hhmm(f.ts)+"</span><br>&ldquo;"+esc(f.quote)+"&rdquo;</div>"+
          '<div class="arrow">↓ extracted</div><span class="tag">'+
          esc(f.observation.replace(/_/g," "))+'</span> <span class="eid">appended as '+
          esc(f.eventId)+"</span></div>";
      }).join("")
    : '<div class="muted">No conversation recorded in this room — monitors only.</div>';

  const rows=[...(h.fresh||[]).map((f)=>[f,"new",""]),
              ...(h.known||[]).map((f)=>[f,"known",f.matchesCondition])];
  const chart=rows.length?rows.map(([f,kind,label])=>
      '<div class="item"><span class="dot '+kind+'"></span><div><div class="code">'+esc(f.code)+
      " · "+esc(f.eventId)+(label?" · already on chart: "+esc(label):"")+"</div>&ldquo;"+
      esc(f.quote)+"&rdquo;</div></div>").join("")
    : '<div class="muted">No coded findings from speech in this room.</div>';

  const qs=(h.flags&&h.flags.length)?h.flags.map((q)=>
      '<div class="q"><div class="cond">'+esc(q.condition)+" · "+esc(q.conditionLabel)+"</div>"+
      '<div class="ask">'+esc(q.question)+'</div><div class="why">'+esc(q.why)+"</div>"+
      '<div class="ev">matched '+esc(q.matched.join(", "))+" · evidence "+
      esc(q.evidence.join(", "))+"</div></div>").join("")
    : '<div class="muted">Nothing triggered.</div>';

  const transcript=utt.length?utt.map((u)=>{
      const future=u.ts>t;
      const derived=EVENTS.filter((e)=>e.room===ROOM&&e.quote===u.quote&&
        FACTS.includes(e.observation)&&e.ts<=t);
      const chips=[];
      if(u.code) chips.push('<span class="chip code">'+esc(u.code)+"</span>");
      for(const d of derived) chips.push('<span class="chip fact">'+esc(d.observation)+"</span>");
      return '<div class="turn'+(future?" future":"")+'">'+
        '<div class="whorow"><span class="p-'+esc(u.speaker)+'">'+esc(u.speaker)+"</span>"+
        '<span class="t">'+hhmm(u.ts)+"</span></div><div>"+esc(u.quote)+"</div>"+
        (chips.length?'<div class="chips">'+chips.join("")+"</div>":"")+"</div>";
    }).join("")
    : '<div class="muted">No speech in this room.</div>';

  $("main").innerHTML='<div class="detail"><div class="col">'+
    '<section><h2>1 · Facts extracted from the conversation <em>'+
      ((h.extracted||[]).length)+' appended</em></h2><div class="body">'+extraction+"</div></section>"+
    '<section><h2>Transcript</h2><div class="body">'+transcript+"</div></section>"+
    '</div><div class="col">'+
    '<section><h2>2 · Held against '+esc(h.patient||ROOM)+"&rsquo;s chart <em>"+
      ((h.conditions||[]).length)+' conditions</em></h2>'+
      '<div class="legend"><i><span class="dot new"></span> new</i>'+
      '<i><span class="dot known"></span> already known</i></div>'+chart+"</section>"+
    '<section><h2>3 · What her history makes worth asking <em>questions, not conclusions</em></h2>'+qs+"</section>"+
    '<section><h2>Patient State <em>'+esc(r?r.level:"—")+'</em></h2>'+
      '<div class="row">'+esc(r?r.reason_text:"")+"</div></section>"+
    "</div></div>";
}

boot();
</script>
</body>
</html>
